[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "myce_pd_event"
version = "2026.1.6"
authors = [
  { name="Avinash Kadaji", email="avi@canusia.com" },
]
description = "MYCE - PD Event"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/Canusia/pd_event"
"Bug Tracker" = "https://github.com/pypa/sampleproject/issues"